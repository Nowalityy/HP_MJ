# Configuration de déploiement Netlify — Elderwood (Next.js 15)
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Runtime Next.js officiel de Netlify (détecté automatiquement, épinglé ici
# pour un déploiement reproductible).
[[plugins]]
  package = "@netlify/plugin-nextjs"
